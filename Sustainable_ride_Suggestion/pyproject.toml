[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sustainable-ride-suggestion"
version = "1.0.0"
description = "Predictive recommender for travel time, cost and CO2 across taxi, bike and e-scooter trips in NYC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
sustainable-ride = "sustainable_ride.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
